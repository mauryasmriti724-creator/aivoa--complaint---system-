<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Aiova AI Complaint Generator</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f2f2f2; }
   .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    textarea, input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; }
    button:hover { background: #218838; }
    #output { background: #f8f9fa; padding: 15px; margin-top: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Aiova AI Complaint Generator</h2>
    <input type="password" id="apikey" placeholder="Apni API Key yaha paste karo">
    <input type="text" id="topic" placeholder="Complaint ka topic likho. Ex: Paani ki samasya">
    <textarea id="details" rows="4" placeholder="Details likho..."></textarea>
    <button onclick="generateComplaint()">AI se Complaint Banwao</button>
    <h3>Generated Complaint:</h3>
    <div id="output"></div>
  </div>

  <script>
    async function generateComplaint() {
      const apiKey = document.getElementById('apikey').value;
      const topic = document.getElementById('topic').value;
      const details = document.getElementById('details').value;
      const output = document.getElementById('output');

      output.innerText = "AI soch raha hai...";

      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: "llama3-8b-8192",
          messages: [{
            role: "user",
            content: `Aiova platform ke liye ek formal complaint likho. Topic: ${topic}. Details: ${details}`
          }]
        })
      });

      const data = await response.json();
      output.innerText = data.choices[0].message.content;
    }
  </script>
</body>
</html>
